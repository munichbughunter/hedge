[package]
name = "hedge"
version = "0.1.0"
edition = "2024"
description = "AI Guard Proxy: sees what your coding agent sends to the LLM API, masks or blocks secrets and PII, and records every request in a signed hash chain."
license = "MIT"
repository = "https://github.com/munichbughunter/hedge"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
colored = "3.1.1"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
libc = "0.2.191"
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
opentelemetry_sdk = "0.33.1"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
whatlang = "0.18.0"

[dev-dependencies]
futures-util = "0.3.34"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", features = ["json"] }
toml = "1.1.8"
tower = "0.5.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
