# nginx in front of Hedge – for hosts that already run nginx.
#
# Copy to /etc/nginx/conf.d/hedge.conf, set server_name, the certificate and
# the admin networks, then `nginx -t && systemctl reload nginx`.
#
# The six things a reverse proxy in front of Hedge has to do are marked (1)–(6);
# the same list is in deploy/central/Caddyfile and docs/operations.md.

upstream hedge_proxy {
    server 127.0.0.1:18765;
    keepalive 16;
}

# The control API on its own port (hedge.toml: [control] listen).
upstream hedge_control {
    server 127.0.0.1:18766;
}

server {
    # (4) No server block on port 80 and no redirect: agents get the
    #     https:// address and nothing else. A redirect can lose the body.
    listen 443 ssl http2;           # nginx ≥ 1.25.1: `listen 443 ssl;` plus `http2 on;`
    server_name hedge.example.com;

    ssl_certificate     /etc/nginx/tls/hedge.crt;
    ssl_certificate_key /etc/nginx/tls/hedge.key;

    # (3) nginx allows 1 MB by default – far too little for an agent that
    #     sends its whole conversation. Hedge answers 413 with a reason for
    #     anything above its own limit (server.max_body_mb).
    client_max_body_size 32m;

    # (5) The control API is for admins. Everyone else gets 404, as if the
    #     path did not exist.
    location /_hedge/ {
        allow 10.0.10.0/24;         # admin network
        allow 127.0.0.1;
        deny  all;
        error_page 403 =404 /_not_found;

        proxy_pass http://hedge_control;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }
    location = /_not_found { internal; return 404; }

    # Liveness and readiness are for the platform, not for the network.
    location = /health { return 404; }
    location = /ready  { return 404; }

    location / {
        proxy_pass http://hedge_proxy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # (1) Answers are server-sent events: pass every chunk on at once.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # Send the request on while it arrives instead of spooling it to disk.
        proxy_request_buffering off;

        # (2) Long and sometimes quiet: Hedge waits up to 600 s for the model
        #     (timeouts.request_secs) and keeps a held tool call open until a
        #     human decides (tools.approval_timeout_secs).
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;

        # (6) nginx passes request and response headers through as they are;
        #     do not add header filters here. `underscores_in_headers` is not
        #     needed: Hedge and the LLM APIs use dashes.
    }
}
