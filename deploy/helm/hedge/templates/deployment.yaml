apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hedge.fullname" . }}
  labels:
    {{- include "hedge.labels" . | nindent 4 }}
spec:
  # One instance, replaced rather than rolled: two pods on the same witness
  # would both continue the chain with the same sequence number.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hedge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hedge.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "hedge.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The volume becomes writable for the hedge user.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hedge
          image: {{ printf "%s:%s" (required "image.repository is required: build the image from the Dockerfile, push it and set its name" .Values.image.repository) (default .Chart.AppVersion .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          env:
            - name: HEDGE_CONFIG
              value: /etc/hedge/hedge.toml
            - name: HOME
              value: /var/lib/hedge
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: proxy
              containerPort: 18765
              protocol: TCP
            - name: control
              containerPort: 18766
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # A large active witness segment takes a moment to read at start.
          startupProbe:
            httpGet:
              path: /health
              port: proxy
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: proxy
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ ternary "/ready" "/health" .Values.readiness.requireWitness }}
              port: proxy
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # The whole directory, so a changed ConfigMap reaches the pod.
            - name: config
              mountPath: /etc/hedge
              readOnly: true
            - name: data
              mountPath: /var/lib/hedge
            {{- if .Values.secrets.existingSecret }}
            - name: secrets
              mountPath: /etc/hedge-secrets
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "hedge.fullname" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "hedge.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.secrets.existingSecret }}
        - name: secrets
          secret:
            secretName: {{ .Values.secrets.existingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
