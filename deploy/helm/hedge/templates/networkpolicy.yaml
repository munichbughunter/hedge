{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hedge.fullname" . }}
  labels:
    {{- include "hedge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hedge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Agents (usually through the ingress controller).
    - ports:
        - port: proxy
          protocol: TCP
      {{- with .Values.networkPolicy.proxyFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.networkPolicy.controlFrom }}
    # Admins.
    - ports:
        - port: control
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
